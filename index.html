<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FamilyVerse 🌌</title>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--bg:#050713;
--bg2:#080d1b;
--card:#0d1326;
--card2:#111a31;
--line:#222d4a;
--text:#f5f7ff;
--muted:#8f9ab5;
--purple:#8b5cf6;
--purple2:#6d28d9;
--cyan:#22d3ee;
--gold:#ffd54a;
--ruby:#ff477e;
--green:#34d399;
--danger:#ff5d73;
--shadow:0 20px 60px rgba(0,0,0,.35);
}

html,body{min-height:100%;width:100%;overflow-x:hidden}

body{
background:
radial-gradient(circle at 15% 10%,rgba(124,58,237,.15),transparent 30%),
radial-gradient(circle at 85% 80%,rgba(34,211,238,.08),transparent 30%),
var(--bg);
color:var(--text);
font-family:Tahoma,Arial,sans-serif;
}

button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

button:disabled{
cursor:not-allowed;
opacity:.6;
transform:none!important;
}

.auth-screen{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.auth-box{
width:min(460px,100%);
padding:34px;
border:1px solid var(--line);
border-radius:30px;
background:rgba(9,14,29,.94);
box-shadow:var(--shadow);
backdrop-filter:blur(20px);
}

.auth-logo{
text-align:center;
font-size:42px;
font-weight:1000;
margin-bottom:8px;
}

.auth-subtitle{
text-align:center;
color:var(--muted);
margin-bottom:25px;
}

.auth-form{display:grid;gap:12px}

.input{
width:100%;
background:#080d1b;
color:#fff;
border:1px solid var(--line);
border-radius:15px;
padding:14px;
outline:none;
transition:.2s;
min-width:0;
}

.input:focus{
border-color:var(--purple);
box-shadow:0 0 0 3px rgba(139,92,246,.12);
}

.btn{
border:1px solid var(--line);
background:var(--card2);
color:#fff;
padding:12px 16px;
border-radius:14px;
font-weight:800;
transition:.2s;
}

.btn:hover{
transform:translateY(-2px);
filter:brightness(1.12);
}

.btn-primary{
border:none;
background:linear-gradient(135deg,var(--purple),var(--purple2));
}

.btn-danger{
background:rgba(255,93,115,.1);
border-color:rgba(255,93,115,.3);
color:#ff8192;
}

.btn-gold{
background:rgba(255,213,74,.1);
color:var(--gold);
border-color:rgba(255,213,74,.25);
}

.btn-ruby{
background:rgba(255,71,126,.1);
color:#ff6b91;
border-color:rgba(255,71,126,.25);
}

.sidebar{
position:fixed;
right:0;
top:0;
bottom:0;
width:265px;
background:rgba(7,11,23,.96);
border-left:1px solid var(--line);
padding:20px 14px;
z-index:50;
backdrop-filter:blur(20px);
}

.brand{
padding:8px 12px 25px;
font-size:24px;
font-weight:1000;
}

.brand small{
display:block;
color:var(--muted);
font-size:11px;
margin-top:5px;
}

.nav{display:grid;gap:6px}

.nav button{
border:0;
background:transparent;
color:#aeb7cf;
text-align:right;
padding:14px;
border-radius:15px;
transition:.2s;
}

.nav button:hover,
.nav button.active{
background:linear-gradient(90deg,#171d38,#11172a);
color:#fff;
}

.nav button.active{
box-shadow:inset -3px 0 var(--purple);
}

.main{
margin-right:265px;
min-height:100vh;
}

.topbar{
height:76px;
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
padding:0 28px;
border-bottom:1px solid var(--line);
background:rgba(5,7,19,.8);
backdrop-filter:blur(18px);
position:sticky;
top:0;
z-index:30;
}

.top-title{
font-size:20px;
font-weight:900;
}

.currency-mini{
display:flex;
gap:10px;
align-items:center;
}

.currency-pill{
padding:8px 12px;
border-radius:12px;
background:#10162a;
border:1px solid var(--line);
font-weight:800;
white-space:nowrap;
}

.gold{color:var(--gold)}
.ruby{color:#ff668d}

.page{
padding:28px;
max-width:1400px;
margin:auto;
}

.page-title{
font-size:32px;
font-weight:1000;
margin-bottom:7px;
}

.page-desc{
color:var(--muted);
margin-bottom:22px;
line-height:1.7;
}

.grid{
display:grid;
gap:16px;
}

.grid-3{
grid-template-columns:repeat(3,1fr);
}

.grid-2{
grid-template-columns:repeat(2,1fr);
}

.card{
background:linear-gradient(145deg,#0d1428,#090e1d);
border:1px solid var(--line);
border-radius:22px;
padding:21px;
box-shadow:0 12px 35px rgba(0,0,0,.16);
}

.card h2,.card h3{
margin-bottom:10px;
}

.hero{
position:relative;
overflow:hidden;
padding:32px;
border-radius:28px;
border:1px solid var(--line);
background:
radial-gradient(circle at 90% 10%,rgba(139,92,246,.3),transparent 35%),
radial-gradient(circle at 10% 100%,rgba(34,211,238,.1),transparent 30%),
#0c1225;
margin-bottom:18px;
}

.hero h1{
font-size:35px;
margin-bottom:10px;
}

.hero p{
color:#aeb8d0;
max-width:700px;
line-height:1.8;
}

.actions{
display:flex;
gap:9px;
flex-wrap:wrap;
margin-top:17px;
}

.stat-value{
font-size:30px;
font-weight:1000;
margin-top:7px;
}

.muted{color:var(--muted)}

.badges{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
gap:10px;
}

.badge{
padding:13px;
background:#11182d;
border:1px solid var(--line);
border-radius:14px;
line-height:1.6;
}

.profile-layout{
display:grid;
grid-template-columns:320px 1fr;
gap:18px;
}

.profile-card{text-align:center}

.avatar{
width:100px;
height:100px;
margin:0 auto 14px;
border-radius:50%;
display:grid;
place-items:center;
background:#171e35;
border:4px solid #46506c;
font-size:45px;
overflow:hidden;
}

.avatar img{
width:100%;
height:100%;
object-fit:cover;
}

.frame-purple{
border-color:#a855f7;
box-shadow:0 0 25px rgba(168,85,247,.5);
}

.frame-gold{
border-color:#ffd54a;
box-shadow:0 0 25px rgba(255,213,74,.5);
}

.frame-ruby{
border-color:#ff416c;
box-shadow:0 0 25px rgba(255,65,108,.5);
}

.frame-cyan{
border-color:#22d3ee;
box-shadow:0 0 25px rgba(34,211,238,.5);
}

.frame-green{
border-color:#34d399;
box-shadow:0 0 25px rgba(52,211,153,.5);
}

.frame-fire{
border-color:#ff7a18;
box-shadow:0 0 25px rgba(255,122,24,.6);
}

.search{
margin-bottom:15px;
}

.people{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
gap:15px;
}

.person{
display:flex;
align-items:center;
gap:12px;
}

.person .avatar{
margin:0;
width:58px;
height:58px;
font-size:25px;
flex:none;
}

.online{
width:9px;
height:9px;
background:var(--green);
border-radius:50%;
display:inline-block;
margin-left:5px;
}

.chat-card{
height:65vh;
display:flex;
flex-direction:column;
}

.messages{
flex:1;
overflow:auto;
padding:10px;
display:flex;
flex-direction:column;
gap:9px;
}

.message{
max-width:75%;
padding:11px 14px;
border-radius:17px;
background:#151c32;
line-height:1.6;
word-break:break-word;
}

.message.mine{
align-self:flex-start;
background:linear-gradient(135deg,#3a217a,#281954);
}

.message-user{
font-size:12px;
color:#b5bdd3;
margin-bottom:3px;
}

.composer{
display:flex;
gap:8px;
margin-top:10px;
}

.composer .input{flex:1}

.store{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
gap:16px;
}

.store-card{
position:relative;
overflow:hidden;
transition:.25s;
}

.store-card:hover{
transform:translateY(-5px);
border-color:#3b4770;
box-shadow:0 18px 45px rgba(0,0,0,.28);
}

.store-icon{
font-size:55px;
margin-bottom:10px;
}

.store-price{
font-size:21px;
font-weight:1000;
margin:12px 0;
}

.store-type{
display:inline-block;
font-size:11px;
padding:5px 8px;
border-radius:20px;
background:#171e35;
color:var(--muted);
margin-bottom:8px;
}

.store-owned{
font-size:12px;
color:var(--green);
margin-bottom:10px;
}

.wallet-cards{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:16px;
margin-bottom:18px;
}

.wallet-big{
font-size:38px;
font-weight:1000;
margin-top:8px;
}

.game-wrap{
width:min(680px,100%);
margin:auto;
}

.xo-card{
background:
radial-gradient(circle at 10% 10%,rgba(139,92,246,.15),transparent 35%),
linear-gradient(145deg,#0e152c,#080d1b);
}

.xo-header{
display:flex;
justify-content:space-between;
align-items:center;
gap:12px;
flex-wrap:wrap;
}

.xo-reward{
padding:10px 14px;
border-radius:14px;
background:rgba(255,213,74,.08);
border:1px solid rgba(255,213,74,.2);
color:var(--gold);
font-weight:900;
}

.xo-board{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin:20px auto;
width:min(560px,100%);
}

.xo-cell{
aspect-ratio:1;
border:1px solid #293555;
background:
radial-gradient(circle,#151f3b,#0e152a);
border-radius:22px;
color:#fff;
font-size:clamp(42px,8vw,72px);
font-weight:1000;
transition:.18s;
box-shadow:inset 0 0 25px rgba(139,92,246,.04);
}

.xo-cell:hover:not(:disabled){
background:#18213c;
transform:scale(1.025);
border-color:#6d5ac5;
box-shadow:0 10px 35px rgba(139,92,246,.12);
}

.xo-cell.x{
color:#a78bfa;
}

.xo-cell.o{
color:#22d3ee;
}

.xo-cell.win{
background:linear-gradient(135deg,#39246e,#123f55);
border-color:#22d3ee;
animation:winPulse .7s infinite alternate;
}

@keyframes winPulse{
from{transform:scale(1)}
to{transform:scale(1.035)}
}

.online-panel{
margin-top:15px;
padding:17px;
border:1px solid rgba(34,211,238,.18);
background:rgba(34,211,238,.045);
border-radius:18px;
}

.room-code{
font-size:28px;
font-weight:1000;
letter-spacing:5px;
text-align:center;
margin:12px 0;
color:#fff;
direction:ltr;
}

.player-strip{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:15px;
}

.player-box{
padding:12px;
border:1px solid var(--line);
border-radius:15px;
background:#10172b;
}

.player-box.active{
border-color:var(--cyan);
box-shadow:0 0 18px rgba(34,211,238,.1);
}

.player-symbol{
font-size:28px;
font-weight:1000;
}

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.72);
display:grid;
place-items:center;
padding:20px;
z-index:100;
backdrop-filter:blur(7px);
}

.modal-box{
width:min(620px,100%);
max-height:90vh;
overflow:auto;
background:#0b1020;
border:1px solid var(--line);
border-radius:25px;
padding:24px;
}

.modal-title{
font-size:24px;
font-weight:1000;
margin-bottom:15px;
}

.close{float:left}

.bottom-nav{display:none}

.toast{
position:fixed;
left:25px;
bottom:25px;
z-index:999;
padding:14px 18px;
background:#171e33;
border:1px solid #303b5b;
color:#fff;
border-radius:14px;
box-shadow:0 15px 40px #0007;
display:none;
max-width:min(90vw,450px);
line-height:1.6;
white-space:pre-line;
}

.filter-bar{
display:flex;
gap:9px;
flex-wrap:wrap;
margin-bottom:18px;
}

.filter-btn.active{
background:linear-gradient(135deg,var(--purple),var(--purple2));
border-color:transparent;
}

.store-summary{
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
flex-wrap:wrap;
padding:15px 18px;
margin-bottom:18px;
border-radius:18px;
background:#0c1327;
border:1px solid var(--line);
}

.equipped{
border-color:var(--green)!important;
box-shadow:0 0 20px rgba(52,211,153,.08);
}

.inventory-list{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
gap:10px;
}

.inventory-item{
padding:12px;
background:#11182d;
border:1px solid var(--line);
border-radius:14px;
}

@media(max-width:1000px){
.sidebar{display:none}
.main{margin-right:0}
.bottom-nav{
display:flex;
position:fixed;
left:0;
right:0;
bottom:0;
background:rgba(7,11,23,.97);
border-top:1px solid var(--line);
z-index:60;
overflow-x:auto;
}

.bottom-nav button{
min-width:75px;
flex:1;
border:0;
background:transparent;
color:#9ca7c0;
padding:9px 5px;
font-size:11px;
}

.bottom-nav button.active{color:#fff}

.page{
padding:18px 14px 95px;
}

.grid-3,
.grid-2,
.wallet-cards,
.profile-layout{
grid-template-columns:1fr;
}

.topbar{
padding:0 15px;
}

.hero{padding:23px}

.hero h1{font-size:28px}
}

@media(max-width:600px){
.auth-box{padding:23px}
.page-title{font-size:27px}
.message{max-width:90%}
.xo-board{gap:7px}
.xo-cell{border-radius:16px}
.store{
grid-template-columns:repeat(2,minmax(0,1fr));
gap:10px;
}
.store-card{padding:15px}
.store-icon{font-size:42px}
.store-price{font-size:17px}
.player-strip{grid-template-columns:1fr}
.currency-mini{gap:5px}
.currency-pill{padding:7px 9px;font-size:12px}
}

@media(max-width:390px){
.store{grid-template-columns:1fr}
.top-title{font-size:17px}
}
</style>
</head>

<body>

<div id="authScreen" class="auth-screen">
<div class="auth-box">

<div class="auth-logo">🌌 FamilyVerse</div>
<div class="auth-subtitle">عالمك العائلي الخاص 💜</div>

<div id="authForm"></div>

</div>
</div>

<div id="app" class="hidden">

<aside class="sidebar">

<div class="brand">
🌌 FamilyVerse
<small>Family • Games • Chat • Fun</small>
</div>

<div id="sideNav" class="nav"></div>

</aside>

<main class="main">

<header class="topbar">

<div id="topTitle" class="top-title">الرئيسية</div>

<div class="currency-mini">

<div class="currency-pill gold">
💰 <span id="topGold">0</span>
</div>

<div class="currency-pill ruby">
💎 <span id="topRuby">0</span>
</div>

</div>

</header>

<section id="page" class="page"></section>

</main>

<nav id="bottomNav" class="bottom-nav"></nav>

</div>

<div id="modalRoot"></div>
<div id="toast" class="toast"></div>

<script>

const firebaseConfig={
apiKey:"AIzaSyD16uVyQo44733AykP6pc0j-Cys3EJ1-tc",
authDomain:"familyverse-ae956.firebaseapp.com",
databaseURL:"https://familyverse-ae956-default-rtdb.firebaseio.com", 
projectId:"familyverse-ae956", 
storageBucket:"familyverse-ae956.firebasestorage.app", 
messagingSenderId:"149212761868", 
appId:"1:149212761868:web:a9365dad907d125627c329", 
measurementId:"G-Z2Y958JQ0S" 
}; 
 
firebase.initializeApp(firebaseConfig); 
 
const auth=firebase.auth(); 
const db=firebase.firestore(); 
 
let currentUser=null; 
let profile=null; 
let currentPage="home"; 
 
let profileUnsub=null; 
let publicUnsub=null; 
let privateUnsub=null; 
let currentPrivateUser=null; 
 
let xoBoard=["","","","","","","","",""]; 
let xoTurn="X"; 
let xoMode="ai"; 
let xoDifficulty="hard"; 
let xoLocked=false; 
 
let onlineRoomId=null; 
let onlinePlayer=null; 
let onlineUnsub=null; 
 
let xoWinningCells=[]; 
 
 
/* ========================= 
NAV 
========================= */ 
 
const navItems=[ 
["home","🏠","الرئيسية"], 
["games","🎮","الألعاب"], 
["store","🛍️","المتجر"], 
["publicChat","💬","الشات العام"], 
["privateChat","✉️","الشات الخاص"], 
["family","👨‍👩‍👧‍👦","العائلة"], 
["wallet","💼","المحفظة"], 
["profile","👤","البروفايل"] 
]; 
 
function renderNav(){ 
 
document.getElementById("sideNav").innerHTML= 
navItems.map(i=> 
`<button class="${currentPage===i[0]?"active":""}" onclick="go('${i[0]}')"> 
${i[1]} ${i[2]} 
</button>` 
).join(""); 
 
document.getElementById("bottomNav").innerHTML= 
navItems.map(i=> 
`<button class="${currentPage===i[0]?"active":""}" onclick="go('${i[0]}')"> 
${i[1]}<br>${i[2]} 
</button>` 
).join(""); 
} 
 
 
function go(page){ 
 
currentPage=page; 
 
renderNav(); 
 
const item=navItems.find(x=>x[0]===page); 
 
document.getElementById("topTitle").textContent= 
item?item[2]:"FamilyVerse"; 
 
if(publicUnsub&&page!=="publicChat"){ 
publicUnsub(); 
publicUnsub=null; 
} 
 
if(privateUnsub&&page!=="privateChat"){ 
privateUnsub(); 
privateUnsub=null; 
} 
 
({ 
home, 
games, 
store, 
publicChat, 
privateChat, 
family, 
wallet, 
profile:profilePage 
}[page]||home)(); 
} 
 
 
function toast(message){ 
 
const box=document.getElementById("toast"); 
 
box.textContent=message; 
box.style.display="block"; 
 
clearTimeout(window.toastTimer); 
 
window.toastTimer= 
setTimeout(()=>box.style.display="none",3500); 
} 
 
 
function escapeHTML(text){ 
 
return String(text??"").replace(/[&<>"']/g,c=>({ 
"&":"&amp;", 
"<":"&lt;", 
">":"&gt;", 
'"':"&quot;", 
"'":"&#39;" 
}[c])); 
 
} 
 
 
/* ========================= 
PROFILE 
========================= */ 
 
function safeProfile(){ 
 
return{ 
 
name:"عضو FamilyVerse", 
username:"", 
bio:"أهلاً بكم في FamilyVerse 💜", 
avatar:"😀", 
profileImage:"", 
frame:"normal", 
status:"متاح", 
title:"عضو العائلة", 
favoriteGame:"XO", 
 
gold:1000, 
ruby:50, 
xp:0, 
wins:0, 
streak:0, 
 
inventory:["frame:normal"], 
 
equipped:{ 
frame:"normal", 
title:"عضو العائلة", 
effect:"none" 
}, 
 
stats:{ 
xoGames:0, 
xoWins:0, 
xoLosses:0, 
xoDraws:0 
}, 
 
lastHourlyReward:0 
 
}; 
 
} 
 
 
function makeInternalAuthId(username){ 
 
username=username.trim().toLowerCase(); 
 
let encoded=""; 
 
try{ 
 
encoded=btoa(encodeURIComponent(username)) 
.replace(/[^a-zA-Z0-9]/g,""); 
 
}catch(e){ 
 
encoded=username.replace(/[^a-zA-Z0-9]/g,""); 
 
} 
 
return"user_"+encoded+"@familyverse.local"; 
 
} 
 
 
function firebaseAuthError(error){ 
 
console.error("Firebase Auth Error:",error); 
 
switch(error.code){ 
 
case"auth/operation-not-allowed": 
return"تسجيل الدخول غير مفعّل في Firebase."; 
 
case"auth/email-already-in-use": 
return"اسم المستخدم مستخدم بالفعل."; 
 
case"auth/weak-password": 
return"كلمة المرور يجب أن تكون 6 أحرف على الأقل."; 
 
case"auth/user-not-found": 
case"auth/wrong-password": 
case"auth/invalid-credential": 
return"اسم المستخدم أو كلمة المرور غير صحيحة."; 
 
case"auth/too-many-requests": 
return"تمت محاولات كثيرة. انتظر قليلًا."; 
 
case"auth/network-request-failed": 
return"مشكلة في الإنترنت."; 
 
default: 
return"خطأ Firebase: "+(error.message||error.code||"غير معروف"); 
 
}

async function register(){ 
 
const name=document.getElementById("registerName").value.trim(); 
const username=document.getElementById("registerUsername").value.trim().toLowerCase(); 
const password=document.getElementById("registerPassword").value; 
const password2=document.getElementById("registerPassword2").value; 
const btn=document.getElementById("registerBtn"); 
 
if(!name||!username||!password||!password2) 
return toast("أكمل جميع البيانات"); 
 
if(!/^[a-z0-9_.-]{3,20}$/.test(username)) 
return toast("اسم المستخدم: 3-20 حرفًا إنجليزيًا أو رقمًا أو _ . -"); 
 
if(password.length<6) 
return toast("كلمة المرور يجب أن تكون 6 أحرف على الأقل"); 
 
if(password!==password2) 
return toast("تأكيد كلمة المرور غير مطابق"); 
 
btn.disabled=true; 
btn.textContent="جارٍ إنشاء الحساب..."; 
 
let createdUser=null; 
 
try{ 
 
const credential= 
await auth.createUserWithEmailAndPassword( 
makeInternalAuthId(username), 
password 
); 
 
createdUser=credential.user; 
 
const exists= 
await db.collection("users") 
.where("username","==",username) 
.limit(1) 
.get(); 
 
if(!exists.empty){ 
 
try{ 
await createdUser.delete(); 
}catch(e){} 
 
createdUser=null; 
 
throw{code:"auth/email-already-in-use"}; 
 
} 
 
const newProfile=safeProfile(); 
 
newProfile.name=name; 
newProfile.username=username; 
 
await db.collection("users") 
.doc(credential.user.uid) 
.set(newProfile); 
 
toast("تم إنشاء الحساب بنجاح 🎉"); 
 
}catch(error){ 
 
console.error(error); 
 
toast( 
error.code==="auth/email-already-in-use" 
?"اسم المستخدم مستخدم بالفعل ❌" 
:error.code==="auth/weak-password" 
?"كلمة المرور ضعيفة." 
:"خطأ Firebase: "+(error.message||error.code) 
); 
 
}finally{ 
 
btn.disabled=false; 
btn.textContent="إنشاء الحساب 🎉"; 
 
} 
 
} 
 
 
async function login(){ 
 
const username= 
document.getElementById("loginUsername").value.trim().toLowerCase(); 
 
const password= 
document.getElementById("loginPassword").value; 
 
const btn=document.getElementById("loginBtn"); 
 
if(!username||!password) 
return toast("اكتب اسم المستخدم وكلمة المرور"); 
 
btn.disabled=true; 
btn.textContent="جارٍ الدخول..."; 
 
try{ 
 
await auth.signInWithEmailAndPassword( 
makeInternalAuthId(username), 
password 
); 
 
}catch(error){ 
 
toast(firebaseAuthError(error)); 
 
}finally{ 
 
btn.disabled=false; 
btn.textContent="دخول 🚀"; 
 
} 
 
}

async function checkHourlyReward(){

profile.lastHourlyReward?.toMillis 
?profile.lastHourlyReward.toMillis()

.doc(currentUser.uid) 
.update({

"+50 ياقوت 💎" 
); 
 
}catch(error){ 
 
console.error("Hourly Reward Error:",error); 
 
} 
 
}

/* ========================= 
XO HELPERS 
========================= */ 
 
function getWinner(board){ 
 
const lines=[ 
[0,1,2], 
[3,4,5], 
[6,7,8], 
[0,3,6], 
[1,4,7], 
[2,5,8], 
[0,4,8], 
[2,4,6] 
]; 
 
for(const line of lines){ 
 
const[a,b,c]=line; 
 
if( 
board[a]&& 
board[a]===board[b]&& 
board[b]===board[c] 
){ 
 
xoWinningCells=line; 
 
return board[a]; 
 
} 
 
} 
 
if(board.every(Boolean)) 
return"draw"; 
 
return null; 
 
} 
 
 
function paintXO(){ 
 
const board=document.getElementById("xoBoard"); 
 
if(!board)return; 
 
board.innerHTML=xoBoard.map((v,i)=>{ 
 
let cls="xo-cell"; 
 
if(v==="X")cls+=" x"; 
if(v==="O")cls+=" o"; 
if(xoWinningCells.includes(i))cls+=" win"; 
 
return` 
 
<button 
class="${cls}" 
${v||xoLocked?"disabled":""} 
onclick="playXO(${i})"> 
${escapeHTML(v)} 
</button>`; 
 
}).join(""); 
 
const info=document.getElementById("xoInfo"); 
 
if(!info)return; 
 
if(xoMode==="online"){ 
 
if(!onlineRoomId){ 
 
info.textContent="🌐 أنشئ غرفة أو انضم إلى غرفة"; 
 
}else if(xoLocked){ 
 
info.textContent="🏁 انتهت المباراة"; 
 
}else if(xoTurn===onlinePlayer){ 
 
info.textContent="✨ دورك الآن"; 
 
}else{

} 
 
}else{

info.textContent="🏁 انتهت المباراة"; 
 
}else if(xoMode==="ai"){ 
 
info.textContent= 
xoTurn==="X" 
?"✨ دورك الآن" 
:"🤖 الكمبيوتر يفكر"; 
 
}else{ 
 
info.textContent="الدور: "+xoTurn; 
 
} 
 
} 
 
} 
 
 
function playXO(i){ 
 
if(xoMode==="online") 
return playOnlineXO(i); 
 
if(xoLocked||xoBoard[i]||getWinner(xoBoard)) 
return; 
 
if(xoMode==="ai"&&xoTurn!=="X") 
return; 
 
xoBoard[i]=xoTurn; 
 
const result=getWinner(xoBoard); 
 
if(result) 
return finishXO(result); 
 
xoTurn=xoTurn==="X"?"O":"X"; 
 
paintXO(); 
 
if(xoMode==="ai"&&xoTurn==="O"){ 
 
xoLocked=true; 
paintXO(); 
 
setTimeout(()=>{ 
 
xoLocked=false; 
aiMove(); 
 
},350); 
 
} 
 
} 
 
 
/* ========================= 
AI 
========================= */ 
 
function aiMove(){ 
 
if(getWinner(xoBoard)) 
return; 
 
const move= 
xoDifficulty==="easy" 
?randomMove() 
:xoDifficulty==="medium" 
?(Math.random()<.55?bestMove():randomMove()) 
:bestMove(); 
 
if(move===undefined)return; 
 
xoBoard[move]="O"; 
 
const result=getWinner(xoBoard); 
 
if(result) 
return finishXO(result); 
 
xoTurn="X"; 
xoLocked=false; 
 
paintXO(); 
 
} 
 
 
function randomMove(){ 
 
const e= 
xoBoard 
.map((x,i)=>x?null:i) 
.filter(x=>x!==null); 
 
return e.length 
?e[Math.floor(Math.random()*e.length)] 
:undefined; 
 
} 
 
 
function bestMove(){ 
 
let best=-Infinity; 
let move; 
 
for(let i=0;i<9;i++){ 
 
if(!xoBoard[i]){ 
 
xoBoard[i]="O"; 
 
const score=minimax(false,0); 
 
xoBoard[i]=""; 
 
if(score>best){ 
 
best=score; 
move=i; 
 
} 
 
} 
 
} 
 
return move; 
 
} 
 
 
function minimax(max,depth){ 
 
const r=getWinner([...xoBoard]); 
 
if(r==="O")return 10-depth; 
if(r==="X")return depth-10; 
if(r==="draw")return 0; 
 
if(max){ 
 
let b=-Infinity; 
 
for(let i=0;i<9;i++){ 
 
if(!xoBoard[i]){ 
 
xoBoard[i]="O"; 
 
b=Math.max( 
b, 
minimax(false,depth+1) 
); 
 
xoBoard[i]=""; 
 
} 
 
} 
 
return b; 
 
}else{ 
 
let b=Infinity; 
 
for(let i=0;i<9;i++){ 
 
if(!xoBoard[i]){ 
 
xoBoard[i]="X"; 
 
b=Math.min( 
b, 
minimax(true,depth+1) 
); 
 
xoBoard[i]=""; 
 
} 
 
} 
 
return b; 
 
} 
 
}

function listenOnlineRoom(){ 
 
if(!onlineRoomId)return; 
 
if(onlineUnsub)

onlineUnsub= 
db.collection("xoRooms") 
.doc(onlineRoomId) 
.onSnapshot(async snap=>{

onlinePlayer=null; 
 
if(onlineUnsub){

paintXO();

} 
 
const room=snap.data(); 
 
xoBoard= 
room.board|| 
["","","","","","","","",""]; 
 
xoTurn=room.turn||"X"; 
 
if(room.winner&&room.winner!=="draw"){ 
 
xoWinningCells=findWinningCells(xoBoard); 
 
} 
 
if(room.status==="finished"){ 
 
xoLocked=true; 
 
if(room.winner==="draw"){ 
 
const info=document.getElementById("xoInfo"); 
 
if(info) 
info.textContent="🤝 تعادل! +200 ذهب"; 
 
}else if(room.winner===onlinePlayer){

if(info)

}else{

if(info) 
info.textContent="😅 اللاعب الآخر فاز"; 
 
} 
 
}else{ 
 
xoLocked=false; 
 
} 
 
paintXO(); 
showOnlineRoomInfo(room); 
 
},error=>{ 
 
console.error("ONLINE XO ERROR:",error); 
 
toast("حدث خطأ في الاتصال بالغرفة"); 
 
}); 
 
} 
 
 
function findWinningCells(board){ 
 
const lines=[ 
[0,1,2], 
[3,4,5], 
[6,7,8], 
[0,3,6], 
[1,4,7], 
[2,5,8], 
[0,4,8], 
[2,4,6] 
]; 
 
for(const line of lines){ 
 
const[a,b,c]=line; 
 
if( 
board[a]&& 
board[a]===board[b]&& 
board[b]===board[c] 
) 
return line; 
 
} 
 
return []; 
 
} 
 
 
async function playOnlineXO(i){ 
 
if(!onlineRoomId||!onlinePlayer) 
return toast("أنشئ غرفة أو انضم إلى غرفة أولًا"); 
 
if(xoLocked) 
return; 
 
try{ 
 
const ref= 
db.collection("xoRooms").doc(onlineRoomId); 
 
let result=null; 
let newBoard=null; 
 
await db.runTransaction(async transaction=>{ 
 
const snap=await transaction.get(ref); 
 
if(!snap.exists) 
throw new Error("ROOM_NOT_FOUND"); 
 
const room=snap.data(); 
 
if(room.status!=="playing") 
throw new Error("GAME_NOT_PLAYING"); 
 
if(room.turn!==onlinePlayer) 
throw new Error("NOT_YOUR_TURN"); 
 
const board= 
[...(room.board||["","","","","","","","",""])]; 
 
if(board[i]) 
throw new Error("CELL_TAKEN"); 
 
board[i]=onlinePlayer; 
 
newBoard=board; 
 
result=getWinner(board); 
 
const updates={ 
board, 
updatedAt: 
firebase.firestore.FieldValue.serverTimestamp() 
}; 
 
if(result){ 
 
updates.status="finished"; 
updates.winner=result; 
updates.rewarded=false; 
 
}else{ 
 
updates.turn= 
onlinePlayer==="X" 
?"O" 
:"X"; 
 
} 
 
transaction.update(ref,updates); 
 
}); 
 
xoBoard=newBoard||xoBoard; 
 
if(result){ 
 
xoLocked=true; 
 
await settleOnlineReward(result); 
 
}else{ 
 
xoTurn= 
onlinePlayer==="X" 
?"O" 
:"X"; 
 
paintXO(); 
 
} 
 
}catch(e){ 
 
console.error("ONLINE MOVE ERROR:",e); 
 
if(e.message==="NOT_YOUR_TURN") 
toast("ليس دورك الآن ⏳"); 
 
else if(e.message==="CELL_TAKEN") 
toast("هذه الخانة مأخوذة"); 
 
else if(e.message==="GAME_NOT_PLAYING") 
toast("المباراة ليست قيد اللعب"); 
 
else 
toast("تعذر تنفيذ الحركة"); 
 
} 
 
} 
 
 
async function settleOnlineReward(result){ 
 
if(!onlineRoomId)return; 
 
const roomRef= 
db.collection("xoRooms").doc(onlineRoomId); 
 
try{ 
 
let shouldReward=false; 
 
await db.runTransaction(async transaction=>{ 
 
const roomSnap= 
await transaction.get(roomRef); 
 
if(!roomSnap.exists)return; 
 
const room=roomSnap.data(); 
 
if(room.rewarded===true)return; 
 
transaction.update(roomRef,{ 
rewarded:true, 
rewardedAt: 
firebase.firestore.FieldValue.serverTimestamp() 
}); 
 
shouldReward=true; 
 
}); 
 
if(!shouldReward)return; 
 
const stats={...(profile.stats||{})}; 
 
stats.xoGames=(stats.xoGames||0)+1; 
 
if(result==="draw"){ 
 
stats.xoDraws=(stats.xoDraws||0)+1; 
 
await saveProfile({ 
 
gold: 
firebase.firestore.FieldValue.increment(200), 
 
xp: 
firebase.firestore.FieldValue.increment(20), 
 
stats 
 
}); 
 
toast("🤝 تعادل! +200 ذهب"); 
 
}else if(result===onlinePlayer){ 
 
stats.xoWins=(stats.xoWins||0)+1; 
 
await saveProfile({ 
 
gold: 
firebase.firestore.FieldValue.increment(1000), 
 
xp: 
firebase.firestore.FieldValue.increment(50), 
 
wins: 
firebase.firestore.FieldValue.increment(1), 
 
stats 
 
}); 
 
toast("🏆 فزت! +1000 ذهب"); 
 
}else{ 
 
stats.xoLosses=(stats.xoLosses||0)+1; 
 
await saveProfile({ 
 
xp: 
firebase.firestore.FieldValue.increment(10), 
 
stats 
 
}); 
 
} 
 
}catch(e){ 
 
console.error("ONLINE REWARD ERROR:",e); 
 
} 
 
} 
 
 
async function leaveOnlineRoom(){ 
 
if(onlineUnsub){ 
 
onlineUnsub(); 
onlineUnsub=null; 
 
} 
 
if(!onlineRoomId){ 
 
onlinePlayer=null; 
return; 
 
} 
 
try{ 
 
const ref= 
db.collection("xoRooms").doc(onlineRoomId); 
 
const snap=await ref.get(); 
 
if(snap.exists){ 
 
const room=snap.data(); 
 
if(room.hostId===currentUser?.uid){ 
 
await ref.delete();

await ref.update({ 
 
guestId:null, 
guestName:null, 
status:"waiting", 
 
updatedAt: 
firebase.firestore.FieldValue.serverTimestamp() 
 
}); 
 
} 
 
} 
 
}catch(e){ 
 
console.error("LEAVE ROOM ERROR:",e); 
 
} 
 
onlineRoomId=null; 
onlinePlayer=null; 
 
}
