const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];function winner(b){for(const [a,c,d] of wins)if(b[a]&&b[a]===b[c]&&b[a]===b[d])return b[a];return b.every(Boolean)?'D':null}
async function xoMove(i){if(xo.over||xo.board[i]||xo.turn!=='X')return;xo.board[i]='X';xo.turn='O';paintXO();let w=winner(xo.board);if(w)return finishXO(w);if(xo.mode==='ai'){setTimeout(()=>{const m=aiMove();if(m>=0)xo.board[m]='O';xo.turn='X';paintXO();w=winner(xo.board);if(w)finishXO(w)},300)}}
function aiMove(){const empty=xo.board.map((v,i)=>v?null:i).filter(i=>i!==null);if(!empty.length)return -1;if(xo.difficulty==='easy')return empty[Math.floor(Math.random()*empty.length)];for(const p of ['O','X'])for(const i of empty){xo.board[i]=p;if(winner(xo.board)===p){xo.board[i]='';return i}xo.board[i]=''}if(xo.board[4]==='')return 4;if(xo.difficulty==='hard'){const corners=empty.filter(i=>[0,2,6,8].includes(i));if(corners.length)return corners[Math.floor(Math.random()*corners.length)]}return empty[Math.floor(Math.random()*empty.length)]}

let chess=null,chessMode='local',selectedSq=null,lastSquares=[];
function openChess(mode){chessMode=mode;chess=new Chess();selectedSq=null;lastSquares=[];$('gameArea').classList.remove('hidden');$('gameArea').innerHTML=`<div class="between"><div><h2 style="margin:0">♟️ Chess</h2><div id="chessStatus" class="muted">الدور: الأبيض</div></div><button class="btn secondary" id="closeGame">✕ خروج</button></div><div class="flex wrap mt"><select id="chessDiff" ${mode==='local'?'disabled':''}><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select><span class="tag">🎁 مكافآت ثابتة ضد الكمبيوتر — بدون رهان</span></div><div class="chess-info"><span id="captured" class="captured">♟️ القطع المأخوذة: —</span><span class="tag" id="chessTurn">أبيض</span></div><div class="chess-wrap"><div id="chessBoard" class="chess-board"></div></div><button class="btn secondary full mt" id="chessReset">🔄 Reset Game</button>`;paintChess();$('closeGame').onclick=()=>{$('gameArea').classList.add('hidden')};$('chessReset').onclick=()=>openChess(mode)}
const pieces={wp:'♙',wn:'♘',wb:'♗',wr:'♖',wq:'♕',wk:'♔',bp:'♟',bn:'♞',bb:'♝',br:'♜',bq:'♛',bk:'♚'};function paintChess(){const b=$('chessBoard');if(!b)return;b.innerHTML='';const board=chess.board();board.forEach((row,r)=>row.forEach((p,c)=>{const sq=String.fromCharCode(97+c)+(8-r),el=document.createElement('button');el.className='sq '+((r+c)%2?'dark':'light')+(selectedSq===sq?' selected':'')+(lastSquares.includes(sq)?' last':'');el.dataset.sq=sq;el.innerHTML=p?`<span class="piece ${p.color==='w'?'white':'black'}">${pieces[p.color+p.type]}</span>`:'';el.onclick=()=>chessClick(sq);b.appendChild(el)}));$('chessStatus').textContent=chess.isCheckmate()?`🏆 Checkmate — ${chess.turn()==='w'?'الأسود':'الأبيض'} يفوز`:chess.isDraw()?'🤝 تعادل':chess.in_check()?`⚠️ Check — ${chess.turn()==='w'?'الأبيض':'الأسود'}`:`الدور: ${chess.turn()==='w'?'الأبيض':'الأسود'}`;$('chessTurn').textContent=chess.turn()==='w'?'أبيض':'أسود';$('captured').textContent='♟️ القطع المأخوذة: '+capturedPieces()}
function capturedPieces(){const cnt={p:8,n:2,b:2,r:2,q:1};const current={p:0,n:0,b:0,r:0,q:0};chess.board().flat().filter(Boolean).forEach(p=>current[p.type]++);let s='';for(const k of Object.keys(cnt)){const n=cnt[k]*2-current[k]*2;if(n>0)s+=pieces['b'+k].repeat(Math.floor(n/2))}return s||'—'}
function chessClick(sq){if(chess.isGameOver())return;const p=chess.get(sq);if(!selectedSq){if(p&&((chess.turn()==='w'&&p.color==='w')||(chess.turn()==='b'&&p.color==='b'))){selectedSq=sq;paintChess()}return}const move=chess.move({from:selectedSq,to:sq,promotion:'q'});if(move){lastSquares=[selectedSq,sq];selectedSq=null;paintChess();if(chess.isGameOver())finishChess();else if(chessMode==='ai'&&chess.turn()==='b')setTimeout(chessAI,350)}else{selectedSq=p&&p.color===chess.turn()?sq:null;paintChess()}}
function chessAI(){const moves=chess.moves();if(!moves.length)return;let pick=moves[Math.floor(Math.random()*moves.length)];if($('chessDiff')?.value!=='easy'){const captures=moves.filter(m=>m.includes('x'));if(captures.length)pick=captures[Math.floor(Math.random()*captures.length)]}chess.move(pick);paintChess();if(chess.isGameOver())finishChess()}
async function finishChess(){metrics.chessGames++;metrics.gamesTotal++;let result='';if(chess.isCheckmate()){const winnerColor=chess.turn()==='w'?'b':'w';if(chessMode==='ai'&&winnerColor==='w'){metrics.wins++;await saveProfile({wins:(profile.wins||0)+1});await addXP(50);await addCurrency(100,0);result='🏆 فزت بالشطرنج: +50 XP +100 🪙';await notify('🏆 فزت في Chess')}else if(chessMode==='ai'){result='🤖 الكمبيوتر فاز'}else {result='🏆 انتهت المباراة'}}else result='🤝 تعادل';toast(result);await saveMetrics()}

function renderPublicChat(){ $('publicChat').innerHTML=`<div class="card chat-shell"><div><div class="rooms">${[['general','🏠 العام'],['gaming','🎮 Gaming'],['study','📚 الدراسة'],['football','⚽ الكورة'],['art','🎨 الرسم'],['movies','🎬 الأفلام'],['music','🎵 الموسيقى']].map(r=>`<button class="${currentRoom===r[0]?'active':''}" data-room="${r[0]}">${r[1]}</button>`).join('')}</div><div class="between"><b id="roomTitle">${roomName(currentRoom)}</b><span class="tag">🟢 Live · آخر 24 ساعة</span></div></div><div id="messages" class="messages"><div class="empty">جاري تحميل الرسائل...</div></div><div class="chat-input"><input id="msgInput" maxlength="1000" placeholder="اكتب رسالتك..."><button id="sendMsg" class="btn">➤</button></div></div>`;document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>{currentRoom=b.dataset.room;renderPublicChat()});$('sendMsg').onclick=sendPublic;$('msgInput').onkeydown=e=>{if(e.key==='Enter')sendPublic()};subscribePublic()}
function roomName(r){return {general:'🏠 العام',gaming:'🎮 Gaming',study:'📚 الدراسة',football:'⚽ الكورة',art:'🎨 الرسم',movies:'🎬 الأفلام',music:'🎵 الموسيقى'}[r]||r}
function subscribePublic(){unsubs.filter(x=>x.type==='public').forEach(x=>x.fn());unsubs=unsubs.filter(x=>x.type!=='public');if(!db||!user)return;const fn=db.collection('groupMessages').where('room','==',currentRoom).limit(200).onSnapshot(s=>{const el=$('messages');if(!el)return;const cutoff=Date.now()-86400000;const rows=[];s.forEach(d=>{const m=d.data();const ms=m.createdAt?.toDate?m.createdAt.toDate().getTime():0;if(ms>=cutoff)rows.push({id:d.id,...m,_ms:ms})});rows.sort((a,b)=>a._ms-b._ms);el.innerHTML=rows.length?'':'<div class="empty">لا توجد رسائل خلال آخر 24 ساعة.</div>';for(const m of rows){const me=m.uid===user.uid;el.insertAdjacentHTML('beforeend',`<div class="message ${me?'me':''}">${avatarHTML({avatar:m.avatar,profileImage:m.profileImage,frame:m.frame})}<div><div class="bubble"><b>${esc(m.name||'عضو')}</b><br>${esc(m.text||'')}</div><div class="msg-meta">${time(m.createdAt)}</div></div></div>`)}el.scrollTop=el.scrollHeight},e=>{console.error('Public chat listener error:',e);toast('❌ تعذر تحميل الشات العام: '+(e.message||'تحقق من Rules'))});unsubs.push({type:'public',fn})}
async function sendPublic(){const inp=$('msgInput'),text=inp.value.trim();if(!text)return;if(text.length>1000)return;inp.value='';try{await db.collection('groupMessages').add({uid:user.uid,name:profile.name,avatar:profile.avatar,profileImage:profile.profileImage||'',frame:profile.frame||'normal',text,room:currentRoom,createdAt:firebase.firestore.FieldValue.serverTimestamp()});metrics.messagesToday++;metrics.messagesTotal++;await saveMetrics()}catch(e){inp.value=text;toast('تعذر إرسال الرسالة')}}
function conversationId(a,b){return [a,b].sort().join('_')}
function renderPrivate(){ $('privateChat').innerHTML=`<div class="private-layout"><div class="card"><div class="between"><h3 style="margin:0">🔒 الرسائل الخاصة</h3><button class="btn secondary" id="goFamily">👥</button></div><div id="privatePeople" class="people mt">جاري التحميل...</div></div><div class="card chat-shell"><div class="between"><div><b id="privateTitle">${privateTarget?esc(privateTarget.name):'اختر شخصًا'}</b><div class="muted">محادثة خاصة بين الطرفين فقط</div></div><button class="btn secondary" id="privateBack">← رجوع</button></div><div id="privateMessages" class="messages"><div class="empty">اختر عضوًا لبدء المحادثة.</div></div><div class="chat-input"><input id="privateInput" maxlength="1000" placeholder="اكتب رسالة خاصة..." ${privateTarget?'':'disabled'}><button id="privateSend" class="btn" ${privateTarget?'':'disabled'}>➤</button></div></div></div>`;$('goFamily').onclick=()=>setPage('family');$('privateBack').onclick=()=>setPage('family');loadPrivatePeople();if(privateTarget){subscribePrivate();$('privateSend').onclick=sendPrivate;$('privateInput').onkeydown=e=>{if(e.key==='Enter')sendPrivate()}}}
async function loadPrivatePeople(){const s=await db.collection('users').limit(100).get();const arr=[];s.forEach(d=>{if(d.id!==user.uid)arr.push({id:d.id,...d.data()})});$('privatePeople').innerHTML=arr.length?arr.map(p=>`<button class="person-btn ${privateTarget?.id===p.id?'active':''}" data-pid="${p.id}">${avatarHTML(p)}<span><b>${esc(p.name)}</b><small class="muted">Level ${Math.floor((p.xp||0)/250)+1}</small></span></button>`).join(''):'<div class="empty">لا يوجد أفراد.</div>';document.querySelectorAll('[data-pid]').forEach(b=>b.onclick=()=>{privateTarget=arr.find(p=>p.id===b.dataset.pid);renderPrivate()})}
function subscribePrivate(){unsubs.filter(x=>x.type==='private').forEach(x=>x.fn());unsubs=unsubs.filter(x=>x.type!=='private');const cid=conversationId(user.uid,privateTarget.id);const fn=db.collection('privateMessages').where('conversationId','==',cid).orderBy('createdAt','asc').limitToLast(200).onSnapshot(s=>{const el=$('privateMessages');el.innerHTML='';s.forEach(d=>{const m=d.data();el.insertAdjacentHTML('beforeend',`<div class="message ${m.from===user.uid?'me':''}">${avatarHTML({avatar:m.avatar,profileImage:m.profileImage})}<div><div class="bubble">${esc(m.text)}</div><div class="msg-meta">${time(m.createdAt)}</div></div></div>`)});el.scrollTop=el.scrollHeight},e=>{console.error(e);toast('تعذر تحميل المحادثة الخاصة')});unsubs.push({type:'private',fn})}
async function sendPrivate(){const i=$('privateInput'),text=i.value.trim();if(!text||!privateTarget)return;i.value='';await db.collection('privateMessages').add({conversationId:conversationId(user.uid,privateTarget.id),from:user.uid,to:privateTarget.id,uid:user.uid,name:profile.name,avatar:profile.avatar,profileImage:profile.profileImage||'',text,createdAt:firebase.firestore.FieldValue.serverTimestamp()});await notify(`💬 رسالة جديدة إلى ${privateTarget.name}`)}
async function notify(text){try{await db.collection('notifications').add({uid:user.uid,text,createdAt:firebase.firestore.FieldValue.serverTimestamp(),read:false})}catch{}}
function subscribeNotifs(){if(!db||!user)return;const fn=db.collection('notifications').where('uid','==',user.uid).where('read','==',false).limit(30).onSnapshot(s=>{const b=$('notifBadge');b.textContent=s.size;b.classList.toggle('hidden',!s.size)});unsubs.push({type:'notif',fn})}
async function showNotifications(){const s=await db.collection('notifications').where('uid','==',user.uid).orderBy('createdAt','desc').limit(40).get();showModal(`<div class="between"><h2>🔔 الإشعارات</h2><button class="btn secondary" id="clearNotifs">قراءة الكل</button></div><div>${s.empty?'<div class="empty">لا توجد إشعارات.</div>':s.docs.map(d=>`<div class="notif">${esc(d.data().text)}<small class="muted">${time(d.data().createdAt)}</small></div>`).join('')}</div>`);$('clearNotifs').onclick=async()=>{const batch=db.batch();s.docs.forEach(d=>batch.update(d.ref,{read:true}));await batch.commit();closeModal();toast('✓ تم تعليم الإشعارات كمقروءة')}}
function showModal(html){$('modalBox').innerHTML=html;$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show');$('modalBox').innerHTML=''}$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};$('notifBtn').onclick=showNotifications;$('quickProfile').onclick=()=>setPage('profile');
function renderAll(){if(!profile)return;$('sideAvatar').outerHTML=avatarHTML(profile);$('sideAvatar').id='sideAvatar';$('sideName').textContent=profile.name;renderHome();if(currentPage==='store')renderStore();if(currentPage==='family')renderFamily();if(currentPage==='profile')renderProfile()}
function renderPage(id){if(id==='home')renderHome();if(id==='games')renderGames();if(id==='store')renderStore();if(id==='publicChat')renderPublicChat();if(id==='privateChat')renderPrivate();if(id==='family')renderFamily();if(id==='profile')renderProfile()}
function authUI(){ $('loading').classList.add('hidden');$('auth').classList.remove('hidden');$('app').classList.add('hidden')}
function appUI(){ $('loading').classList.add('hidden');$('auth').classList.add('hidden');$('app').classList.remove('hidden');buildNav();renderAll();setPage('home')}
$('loginTab').onclick=()=>{authMode='login';$('loginTab').classList.add('active');$('registerTab').classList.remove('active');$('confirmField').classList.add('hidden');$('authUser').placeholder='اسم المستخدم';$('authSubmit').textContent='🚀 تسجيل الدخول'};$('registerTab').onclick=()=>{authMode='register';$('registerTab').classList.add('active');$('loginTab').classList.remove('active');$('confirmField').classList.remove('hidden');$('authUser').placeholder='اسم المستخدم';$('authSubmit').textContent='✨ إنشاء حساب'};
$('authForm').onsubmit=async e=>{e.preventDefault();$('authError').textContent='';const u=$('authUser').value.trim(),p=$('authPass').value;if(authMode==='login'){try{const s=await db.collection('users').where('username','==',u).limit(1).get();if(s.empty)throw new Error('اسم المستخدم غير موجود');const email=s.docs[0].data().email;if(!email)throw new Error('الحساب غير مكتمل');await auth.signInWithEmailAndPassword(email,p)}catch(err){$('authError').textContent='❌ '+(err.message||'تعذر تسجيل الدخول')}}else{const c=$('authConfirm').value;if(p!==c)return $('authError').textContent='❌ كلمتا المرور غير متطابقتين';if(p.length<6)return $('authError').textContent='❌ كلمة المرور يجب أن تكون 6 أحرف على الأقل';try{const email=`${u.toLowerCase().replace(/[^a-z0-9._-]/g,'')||'member'}_${Date.now()}@familyverse.local`;const cred=await auth.createUserWithEmailAndPassword(email,p);await db.collection('users').doc(cred.user.uid).set(baseProfile({name:u,username:u,email}));toast('🎉 تم إنشاء حسابك')}catch(err){$('authError').textContent='❌ '+(err.message||'تعذر إنشاء الحساب')}}};
async function cleanupOldMessages(){try{const cutoff=Date.now()-86400000;for(const room of ['general','gaming','study','football','art','movies','music']){const s=await db.collection('groupMessages').where('room','==',room).limit(200).get();const old=s.docs.filter(d=>{const ts=d.data().createdAt;const ms=ts?.toDate?ts.toDate().getTime():0;return ms>0&&ms<cutoff}).slice(0,50);if(old.length){const batch=db.batch();old.forEach(d=>batch.delete(d.ref));await batch.commit()}}}catch(e){console.warn('cleanup skipped',e.message)}}
async function boot(){try{if(CONFIG.apiKey.startsWith('YOUR_')){authUI();$('authError').textContent='⚙️ لم يتم وضع Firebase Config بعد. افتح index.html واستبدل قيم CONFIG بإعدادات مشروع Firebase.';return}firebase.initializeApp(CONFIG);firebaseReady=true;auth=firebase.auth();db=firebase.firestore();try{storage=firebase.storage()}catch{}auth.onAuthStateChanged(async u=>{unsubs.forEach(x=>x.fn());unsubs=[];user=u;if(!u){authUI();return}const ref=db.collection('users').doc(u.uid),snap=await ref.get();if(!snap.exists)await ref.set(baseProfile({email:u.email}));profile=(await ref.get()).data();if(!profile.inventory)profile.inventory=[];await loadMetrics();appUI();subscribeNotifs();cleanupOldMessages();});}catch(e){console.error(e);authUI();$('authError').textContent='❌ خطأ في Firebase: '+e.message}}
boot();
</script>
</body>
</html>
